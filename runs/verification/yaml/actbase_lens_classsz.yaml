# Verification chain on the cosmo2017 mocks (runs/verification/README.md).
# Replace REPO_ROOT (your clone) and OUTPUT_ROOT (chain directory) before running.
theory:
  classy_szfast.classy_sz.classy_sz:
    use_class_sz_fast_mode: 1
    lensing_lkl: ACT
    path: null
    stop_at_error: true
    extra_args:
      modes: s,t
      output: tCl,lCl,pCl
      skip_background_and_thermo: 1
      skip_pkl: 1
      skip_pknl: 1
      skip_chi: 0
      skip_hubble: 0
      skip_sigma8_and_der: 0
      skip_sigma8_at_z: 0
      k_pivot: 0.05
      N_ncdm: 1
      N_ur: 2.0328
      m_ncdm: 0.06
      cosmo_model: 0
      class_sz_verbose: 0
likelihood:
  dr6plus_lenslike.ACTDR6LensLike:
    variant: actbase
    mock: true
    mock_file: REPO_ROOT/tests/mock/cosmo2017/clkk_bandpowers_mock.txt
    trim_lmax: 2998
    apply_hartlap: true
    lmax: 4000
    stop_at_error: true
    lens_only: true
    no_like_corrections: true
    analytic_marg: true
    cov_file: null
params:
  logA:
    prior:
      min: 2
      max: 4
    proposal: 0.12892144
    ref:
      dist: norm
      loc: 2.9939341
      scale: 0.12892144
    latex: \ln(10^{10} A_\mathrm{s})
  As:
    derived: true
    latex: A_\mathrm{s}
  n_s:
    prior:
      dist: norm
      loc: 0.9625356
      scale: 0.02
    proposal: 0.002
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    latex: n_\mathrm{s}
  omega_b:
    prior:
      dist: norm
      loc: 0.02219218
      scale: 0.0005
    proposal: 0.0001
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior:
      min: 0.005
      max: 0.99
    proposal: 0.0005
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    latex: \Omega_\mathrm{c} h^2
  H0:
    prior:
      min: 40.0
      max: 100.0
    proposal: 2.0
    ref:
      dist: norm
      loc: 69.351243
      scale: 2.0
    latex: H_0
  tau_reio: 0.06574325
  mnu: 0.06
  sigma8:
    latex: \sigma_8
    derived: true
  omegam:
    latex: \Omega_\mathrm{m}
    derived: true
  S825:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.25'
    latex: \sigma_8 (\Omega_\mathrm{m}/0.3)^{0.25}
  S85:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5'
    latex: \sigma_8 (\Omega_\mathrm{m}/0.3)^{0.5}
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  rdrag:
    latex: r_\mathrm{drag}
    derived: true
sampler:
  mcmc:
    burn_in: 0
    max_tries: 10000
    covmat: null
    proposal_scale: 1.9
    learn_every: 40d
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    output_every: 60s
output: OUTPUT_ROOT/actbase_lens_classsz/actbase_lens_classsz
