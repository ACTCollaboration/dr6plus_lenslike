# Verification chain on the cosmo2017 mocks (runs/verification/README.md).
# Replace REPO_ROOT (your clone) and OUTPUT_ROOT (chain directory) before running.
theory:
  camb:
    extra_args:
      kmax: 10
      k_per_logint: 130
      nonlinear: true
      lens_potential_accuracy: 8
      lens_margin: 2050
      lAccuracyBoost: 1.2
      min_l_logl_sampling: 6000
      DoLateRadTruncation: false
      recombination_model: CosmoRec
    stop_at_error: false
likelihood:
  act_dr6_cmbonly.PlanckActCut:
    dataset_params:
      use_cl: tt te ee
      lmin_cuts: 0 0 0
      lmax_cuts: 1000 600 600
    params:
      A_planck:
        prior:
          min: 0.5
          max: 1.5
        ref:
          dist: norm
          loc: 1.0
          scale: 0.1
        latex: A_{\rm planck}
        proposal: 0.003
    path: REPO_ROOT/tests/mock/cosmo2017/cmb/planck_2018_pliklite_mock
  act_dr6_cmbonly.ACTDR6CMBonly:
    input_file: dr6_data_cmbonly_mock.fits
    lmax_theory: 9000
    ell_cuts:
      TT:
      - 600
      - 8500
      TE:
      - 600
      - 8500
      EE:
      - 600
      - 8500
    stop_at_error: true
    params:
      A_act:
        value: 'lambda A_planck: A_planck'
        latex: A_{\rm ACT}
      P_act:
        prior:
          min: 0.9
          max: 1.1
        ref:
          dist: norm
          loc: 1.0
          scale: 0.01
        proposal: 0.01
        latex: p_{\rm ACT}
    data_folder: REPO_ROOT/tests/mock/cosmo2017/cmb/ACTDR6CMBonly
    version: v1.0
  dr6plus_lenslike.ACTDR6LensLike:
    variant: actbase
    mock: true
    mock_file: REPO_ROOT/tests/mock/cosmo2017/clkk_bandpowers_mock.txt
    trim_lmax: 2998
    apply_hartlap: true
    lmax: 4000
    stop_at_error: true
    lens_only: false
    no_like_corrections: false
    map_frame_cal: true
  bao.desi_dr2.desi_bao_all:
    path: REPO_ROOT/tests/mock/cosmo2017/bao
    measurements_file: desi_gaussian_bao_ALL_GCcomb_mean_mock.txt
    cov_file: desi_gaussian_bao_ALL_GCcomb_cov.txt
params:
  ombh2:
    prior:
      min: 0.017
      max: 0.027
    proposal: 6.5e-05
    ref:
      dist: norm
      loc: 0.02239
      scale: 0.0021
    latex: \Omega_\mathrm{b}h^2
  omch2:
    prior:
      min: 0.09
      max: 0.15
    proposal: 0.0011
    ref:
      dist: norm
      loc: 0.12
      scale: 0.026
    latex: \Omega_\mathrm{c}h^2
  cosmomc_theta:
    prior:
      min: 0.0103
      max: 0.0105
    proposal: 1.0e-05
    ref:
      dist: norm
      loc: 0.010417
      scale: 6.7e-05
    latex: \theta_\mathrm{MC}
  logA:
    prior:
      min: 2.6
      max: 3.5
    proposal: 0.0036
    ref:
      dist: norm
      loc: 3.064
      scale: 0.24
    latex: \log(10^{10} A_\mathrm{s})
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    derived: true
    latex: A_\mathrm{s}
  ns:
    prior:
      min: 0.9
      max: 1.1
    proposal: 0.0033
    ref:
      dist: norm
      loc: 0.9729
      scale: 0.061
    latex: n_\mathrm{s}
  tau:
    prior:
      dist: norm
      loc: 0.06574325
      scale: 0.0065
    proposal: 0.0073
    ref:
      dist: norm
      loc: 0.06574325
      scale: 0.0073
    latex: \tau_\mathrm{reio}
  mnu: 0.06
  H0:
    latex: H_0
    derived: true
  sigma8:
    latex: \sigma_8
    derived: true
  omegam:
    latex: \Omega_\mathrm{m}
    derived: true
  S825:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.25'
    latex: \sigma_8 (\Omega_\mathrm{m}/0.3)^{0.25}
  S85:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5'
    latex: \sigma_8 (\Omega_\mathrm{m}/0.3)^{0.5}
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  rdrag:
    latex: r_\mathrm{drag}
    derived: true
sampler:
  mcmc:
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.05
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_max: 10.0
    covmat: REPO_ROOT/runs/verification/covmats/pact_bao_mnu.covmat
    output_every: 60s
output: OUTPUT_ROOT/actbase_lenscmbbao_camb/actbase_lenscmbbao_camb
prior:
  cal_dip_prior: 'lambda A_act: stats.norm.logpdf(A_act, loc=1.0, scale=0.003)'
