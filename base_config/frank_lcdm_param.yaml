theory:
  classy_szfast.classy_sz.classy_sz:
    use_class_sz_fast_mode: 1
    use_class_sz_no_cosmo_mode: 0
    lensing_lkl: ACT
    path: null
    speed: 0.2
    stop_at_error: true
    extra_args:
      modes: s,t
      output: tCl,lCl,pCl
      skip_background_and_thermo: 1
      skip_pkl: 1
      skip_pknl: 1
      skip_chi: 0
      skip_hubble: 0
      skip_sigma8_and_der: 0
      skip_sigma8_at_z: 0
      k_pivot: 0.05
      N_ncdm: 1
      N_ur: 2.0328
      m_ncdm: 0.06
      cosmo_model: 0
      class_sz_verbose: 0
    ignore_obsolete: false
    use_renames: false
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
    version: v2.9.4
    input_params:
    - logA
    - n_s
    - mnu
    - omega_b
    - omega_cdm
    - H0
    - tau_reio
    output_params:
    - As
    - sigma8
    - YHe
    - age
    - omegam
    - rdrag
    - zrei
likelihood:
  dr6plus_lenslike.ACTDR6LensLike:
    lmax: 4000
    mock: false
    nsims_act: 792.0
    nsims_planck: 400.0
    no_like_corrections: true
    no_actlike_cmb_corrections: false
    lens_only: true
    trim_lmax: 2998
    variant: day_baseline
    indep: false
    apply_hartlap: true
    limber: false
    nz: 100
    kmax: 10
    zmax: null
    scale_cov: null
    varying_cmb_alens: false
    version: null
    act_cmb_rescale: false
    act_calib: false
    spt_start: 0
    spt_end: null
    type: []
    speed: -1
    stop_at_error: true
    input_params: []
    output_params: []
params:
  A:
    derived: 'lambda As: 1e9*As'
    latex: 10^9 A_\mathrm{s}
  logA:
    latex: ln10^{10}A_s
    prior:
      max: 4
      min: 2
    proposal: 0.12892144
    ref:
      dist: norm
      loc: 2.9939341
      scale: 0.12892144
  As:
    derived: true
    latex: A_\mathrm{s}
    renames:
    - A_s
  n_s:
    latex: n_\mathrm{s}
    prior:
      dist: norm
      loc: 0.96
      scale: 0.02
    proposal: 0.002
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    renames:
    - ns
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp25:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  s8omegamp5:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  S825:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.25'
    latex: \sigma_8 (\Omega_\mathrm{m}/0.3)^{0.25}
  S85:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5'
    latex: \sigma_8 (\Omega_\mathrm{m}/0.3)^{0.5}
  sigma8:
    latex: \sigma_8
    derived: true
  YHe:
    latex: Y_\mathrm{P}
    derived: true
    renames:
    - yheused
    - yhe
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
    derived: true
  mnu:
    value: 0.06
  omega_b:
    latex: \Omega_\mathrm{b} h^2
    prior:
      dist: norm
      loc: 0.02233
      scale: 0.0005
    proposal: 0.0001
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    renames:
    - omegabh2
  omega_cdm:
    latex: \Omega_\mathrm{c} h^2
    prior:
      max: 0.99
      min: 0.005
    proposal: 0.0005
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    renames:
    - omegach2
  omegam:
    latex: \Omega_\mathrm{m}
    derived: true
    renames:
    - Omega_m
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  rdrag:
    latex: r_\mathrm{drag}
    derived: true
    renames:
    - rs_drag
  zrei:
    latex: z_\mathrm{re}
    derived: true
    renames:
    - z_reio
  H0:
    latex: H_0
    prior:
      max: 100.0
      min: 40.0
    proposal: 2.0
    ref:
      dist: norm
      loc: 69.351243
      scale: 2.0
  tau_reio:
    value: 0.055
    renames:
    - tau
